  - - 8
    - 16
    - 32
    - 64
  n_steps:
  - int
  - 3
  - 8
  gamma:
  - float
  - 1.0
  - 2.0
  momentum:
  - float
  - 0.01
  - 0.4
  batch_size_multiplier:
  - categorical
  - - 0.5
    - 1
    - 2
