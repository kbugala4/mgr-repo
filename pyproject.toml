[project]
name = "tabular-thesis"
version = "0.1.0"
description = "Deep Learning Algorithms for Tabular Data — Master's Thesis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
    "xgboost==3.2.0", "catboost==1.2.10", "torch==2.13.0",
    "pytorch-tabnet==4.1.0", "rtdl-revisiting-models==0.0.2",
    "omegaconf>=2.3", "filelock>=3.13", "pyarrow>=14", "threadpoolctl>=3.1", "psutil>=5.9",
    "tabarena[search-spaces,preprocessing,data-foundry]==0.1.0",
    "autogluon.tabular==1.6.3b20260918",
    "autogluon.core[ray]==1.6.3b20260918",
    "matplotlib>=3.8", "seaborn>=0.13",
    "pytabkit==1.8.0", "tabm==0.0.3", "rtdl-num-embeddings>=0.0.12",
    "category-encoders==2.11.2", "tabpfn==9.2.0",
]

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
thesis = "tabular_thesis.experiments.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabular_thesis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N806"] # Conventional sklearn feature-matrix names (X, X_train).

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build.targets.wheel.force-include]
"configs" = "tabular_thesis/configs"
"uv.lock" = "tabular_thesis/uv.lock"

[tool.uv]
prerelease = "allow"
